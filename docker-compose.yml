version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mmc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: orbya_tech_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbya_tech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmc_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/orbya_tech_db?schema=public
      - JWT_SECRET=super_secret_jwt_token_for_orbya_tech_digital_campus_saas
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    # Auto-migrate and seed the database on container start, then run next.js web server
    command: sh -c "npx prisma db push && npm run start"

volumes:
  pgdata:
